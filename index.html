<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Who's DewZ Official Site</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    :root {
      --blue: #299cff;
      --blue2: #006eff;
      --glass: rgba(255,255,255,0.12);
      --border: rgba(255,255,255,0.25);
      --white: #ffffff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "Segoe UI", sans-serif;
      color: white;
      min-height: 100vh;
      overflow-x: hidden;

      background:
        radial-gradient(circle at 20% 20%, rgba(0,140,255,.35), transparent 30%),
        radial-gradient(circle at 80% 70%, rgba(100,0,255,.30), transparent 35%),
        linear-gradient(135deg, #020617, #061b3b, #020617);
    }

    /* Background glow */

    .glow {
      position: fixed;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: rgba(0,140,255,.25);
      filter: blur(100px);
      z-index: -1;
      animation: glowMove 8s infinite alternate ease-in-out;
    }

    .glow.one {
      top: 10%;
      left: -100px;
    }

    .glow.two {
      bottom: 5%;
      right: -100px;
      background: rgba(80,0,255,.25);
      animation-delay: 2s;
    }

    @keyframes glowMove {
      from {
        transform: translate(0,0) scale(1);
      }
      to {
        transform: translate(100px,50px) scale(1.3);
      }
    }

    /* Navigation */

    nav {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 30px);
      max-width: 1000px;
      padding: 12px 18px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: rgba(255,255,255,.10);
      border: 1px solid var(--border);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);

      border-radius: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,.25);

      z-index: 1000;
    }
